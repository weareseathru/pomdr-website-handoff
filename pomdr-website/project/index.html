<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>POMDR, Helping Senior Dogs and Senior People Since 2009</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,400..600&display=swap" />
<style>
:root {
  --blue-900: #004e63;
  --blue-700: #006c8a;
  --blue: #008bb0;
  --blue-400: #26A1BF;
  --blue-200: #7CB9D0;
  --blue-100: #BCD7E4;
  --blue-50: #E8F2F6;

  --purple: #632F88;
  --purple-400: #7F5A9D;
  --purple-200: #A085B7;
  --purple-100: #C9BBD7;
  --purple-50: #F1EBF5;

  --ink: #16202b;
  --ink-2: #3c4a57;
  --ink-3: #6b7885;
  --line: #e5ddd0;
  --cream: #FAF6F0;
  --cream-2: #F3ECDF;
  --white: #ffffff;

  --font-sans: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-serif: 'Source Serif 4', 'Iowan Old Style', 'Palatino', serif;

  --radius-sm: 14px;
  --radius: 22px;
  --radius-lg: 32px;
  --radius-xl: 44px;

  --shadow-sm: 0 2px 8px rgba(22, 32, 43, 0.04), 0 1px 2px rgba(22,32,43,0.03);
  --shadow: 0 12px 32px -8px rgba(22, 32, 43, 0.12), 0 2px 6px rgba(22,32,43,0.04);
  --shadow-lg: 0 30px 60px -20px rgba(22, 32, 43, 0.25);

  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

/* Skip link: invisible until focused, jumps past nav to <main>. */
.skip-link {
  position: absolute;
  top: -100px;
  left: 8px;
  z-index: 200;
  background: var(--purple);
  color: var(--white);
  font-weight: 600;
  padding: 10px 16px;
  border-radius: 8px;
  text-decoration: none;
  transition: top 0.18s var(--ease);
}
.skip-link:focus { top: 8px; outline: 2px solid var(--white); outline-offset: 2px; }

/* Visible keyboard focus ring on every interactive element. */
:focus-visible {
  outline: 2px solid var(--blue-700);
  outline-offset: 2px;
  border-radius: 4px;
}

/* Honor reduced-motion preference globally. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
body {
  font-family: var(--font-sans);
  color: var(--ink);
  background: var(--cream);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-size: 17px;
  line-height: 1.6;
  overflow-x: hidden;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

.serif { font-family: var(--font-serif); font-weight: 400; letter-spacing: -0.01em; }
.eyebrow {
  font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600;
  color: var(--blue-700); display: inline-flex; align-items: center; gap: 10px;
}
.eyebrow::before {
  content: ""; width: 24px; height: 1px; background: var(--blue); display: inline-block;
}

.container { max-width: 1320px; margin: 0 auto; padding: 0 32px; }

/* ===== NAV ===== */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 16px 0;
  transition: all 0.4s var(--ease);
}
.nav-inner {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(22,32,43,0.06);
  border-radius: 999px;
  padding: 8px 10px 8px 24px;
  box-shadow: 0 8px 32px -12px rgba(22,32,43,0.12);
}
.nav.scrolled .nav-inner { background: rgba(255,255,255,0.97); }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--blue); color: white;
  display: grid; place-items: center;
  font-family: var(--font-serif); font-style: italic; font-size: 17px;
  flex-shrink: 0;
}
.logo-text .name { font-family: var(--font-serif); font-size: 17px; font-weight: 500; color: var(--ink); line-height: 1; letter-spacing: -0.01em; }
.logo-text .sub { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-top: 3px; }

.nav-links { display: flex; gap: 2px; align-items: center; }
.nav-item { position: relative; }
.nav-item > a, .nav-item > button {
  padding: 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 500;
  color: var(--ink-2); transition: all 0.2s var(--ease);
  display: inline-flex; align-items: center; gap: 5px;
  background: none; border: none; font-family: inherit; cursor: pointer;
  white-space: nowrap;
}
.nav-item > a:hover, .nav-item > button:hover,
.nav-item:hover > a, .nav-item:hover > button { background: var(--blue-50); color: var(--blue-700); }
.nav-item > a.active, .nav-item > button.active { color: var(--blue-700); }
.nav-chevron { width: 10px; height: 10px; opacity: 0.5; transition: transform 0.2s; }
.nav-item:hover .nav-chevron { transform: rotate(180deg); }

/* Dropdown */
.nav-dropdown {
  position: absolute; top: 100%; left: 50%;
  background: white; border-radius: 18px; padding: 16px 8px 8px;
  box-shadow: 0 20px 48px -12px rgba(22,32,43,0.2), 0 0 0 1px rgba(22,32,43,0.06);
  min-width: 220px; width: max-content;
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
  transform: translateX(-50%) translateY(4px);
}
.nav-dropdown::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 12px;
  background: transparent;
}
.nav-item:hover .nav-dropdown {
  opacity: 1; visibility: visible; pointer-events: auto;
  transform: translateX(-50%) translateY(0);
}
.nav-dropdown a {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 12px; font-size: 14px;
  color: var(--ink-2); font-weight: 500;
  transition: all 0.15s;
}
.nav-dropdown a:hover { background: var(--blue-50); color: var(--blue-700); }
.nav-dropdown .dd-section {
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
  font-weight: 700; color: var(--ink-3); padding: 10px 14px 4px;
}
.nav-dropdown .dd-divider { height: 1px; background: var(--line); margin: 6px 8px; }
.nav-dropdown .dd-icon {
  width: 28px; height: 28px; border-radius: 8px;
  display: grid; place-items: center; flex-shrink: 0;
}
.nav-dropdown .dd-icon svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }

.nav-cta {
  background: var(--blue) !important; color: white !important;
  padding: 11px 20px !important; font-weight: 600 !important; font-size: 14px !important;
  box-shadow: 0 6px 16px -4px rgba(0,139,176,0.4);
  border-radius: 999px !important;
}
.nav-cta:hover { background: var(--blue-700) !important; transform: translateY(-1px); box-shadow: 0 8px 20px -4px rgba(0,139,176,0.5) !important; }

@media (max-width: 960px) {
  .nav-item:not(:last-child) > a, .nav-item:not(:last-child) > button { display: none; }
}

/* ===== HERO ===== */
.hero {
  position: relative; height: 100vh; min-height: 680px; max-height: 920px;
  overflow: hidden; background: var(--ink);
}
.hero-slide {
  position: absolute; inset: 0;
  opacity: 0;
  transition: opacity 1.2s var(--ease);
  pointer-events: none;
}
.hero-slide.active { opacity: 1; pointer-events: auto; }
.hero-image {
  position: absolute; inset: -40px -20px; /* extra for kenburns */
  background-size: cover; background-position: center;
  animation: none;
}
.hero-slide.active .hero-image {
  animation: kenburns 10s ease-out forwards;
}
@keyframes kenburns {
  from { transform: scale(1.05) translate(0,0); }
  to   { transform: scale(1.15) translate(-1%, -2%); }
}
.hero-scrim {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.05) 30%, rgba(0,0,0,0.55) 100%),
    linear-gradient(90deg, rgba(22,32,43,0.45) 0%, rgba(22,32,43,0) 55%);
}

.hero-content {
  position: relative; z-index: 2; height: 100%;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 120px 0 80px;
  color: white;
}
.hero-content .container { width: 100%; }
.hero-tag {
  display: inline-flex; align-items: center; gap: 12px;
  background: rgba(255,255,255,0.14); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.22);
  padding: 8px 16px 8px 10px; border-radius: 999px;
  font-size: 13px; font-weight: 500;
  margin-bottom: 28px;
  animation: fadeUp 0.9s var(--ease) 0.2s both;
}
.hero-tag .dot {
  width: 26px; height: 26px; border-radius: 50%; background: var(--blue);
  display: grid; place-items: center; font-size: 14px;
}
.hero-title {
  font-family: var(--font-sans);
  font-weight: 300;
  font-size: clamp(42px, 6.2vw, 96px);
  line-height: 0.98;
  letter-spacing: -0.035em;
  margin: 0 0 24px;
  max-width: 16ch;
  animation: fadeUp 0.9s var(--ease) 0.35s both;
}
.hero-title em {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 300;
  color: #f7ddb7;
}
.hero-sub {
  font-size: 19px; max-width: 48ch;
  color: rgba(255,255,255,0.9);
  margin: 0 0 36px;
  animation: fadeUp 0.9s var(--ease) 0.5s both;
}
.hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; animation: fadeUp 0.9s var(--ease) 0.65s both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 16px 28px; border-radius: 999px; font-weight: 600; font-size: 15px;
  transition: all 0.25s var(--ease);
  white-space: nowrap;
}
.btn-primary { background: var(--blue); color: white; box-shadow: 0 10px 24px -6px rgba(0,139,176,0.5); }
.btn-primary:hover { background: var(--blue-700); transform: translateY(-2px); box-shadow: 0 14px 32px -6px rgba(0,139,176,0.55); }
.btn-light { background: white; color: var(--ink); }
.btn-light:hover { background: var(--cream); transform: translateY(-2px); }
.btn-ghost { background: rgba(255,255,255,0.12); color: white; border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(10px); }
.btn-ghost:hover { background: rgba(255,255,255,0.2); }
.btn-outline { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
.btn-outline:hover { background: var(--ink); color: var(--cream); }
.btn-purple { background: var(--purple); color: white; box-shadow: 0 10px 24px -6px rgba(99,47,136,0.5); }
.btn-purple:hover { background: #4b2268; transform: translateY(-2px); }
.btn svg { width: 16px; height: 16px; }

/* Hero dog meta card */
.hero-meta {
  position: absolute; right: 32px; bottom: 92px; z-index: 3;
  background: rgba(255,255,255,0.95); backdrop-filter: blur(14px);
  border-radius: 28px; padding: 20px 24px;
  display: flex; align-items: center; gap: 18px;
  box-shadow: var(--shadow-lg);
  min-width: 280px;
  animation: fadeUp 0.9s var(--ease) 0.8s both;
}
.hero-meta .avatar {
  width: 52px; height: 52px; border-radius: 50%;
  background-size: cover; background-position: center;
  box-shadow: 0 0 0 3px white, 0 0 0 4px var(--blue-100);
  flex-shrink: 0;
}
.hero-meta .meta-num {
  display: flex; flex-direction: column; align-items: flex-start;
  padding-right: 18px; border-right: 1px solid var(--line);
  flex-shrink: 0;
}
.hero-meta .meta-num-cur {
  font-family: var(--font-serif); font-weight: 400;
  font-size: 38px; line-height: 1; color: var(--blue);
  letter-spacing: -0.02em;
}
.hero-meta .meta-num-total {
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 600; margin-top: 6px;
}
.hero-meta .label { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--purple); font-weight: 600; }
.hero-meta .name { font-family: var(--font-serif); font-size: 22px; font-weight: 500; color: var(--ink); line-height: 1.1; margin-top: 2px; }
.hero-meta .meta-sub { font-size: 13px; color: var(--ink-3); margin-top: 4px; }

/* Hero controls */
.hero-controls {
  position: absolute; left: 32px; right: 32px; bottom: 32px; z-index: 4;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
}
.hero-controls > * { pointer-events: auto; }
.hero-progress {
  display: flex; gap: 8px; align-items: center;
}
.hero-progress button {
  width: 44px; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px;
  position: relative; overflow: hidden; transition: width 0.3s;
}
.hero-progress button.active { width: 88px; }
.hero-progress button .bar {
  position: absolute; inset: 0 auto 0 0; background: white; width: 0%;
}
.hero-progress button.active .bar {
  animation: fill 6s linear forwards;
}
@keyframes fill { to { width: 100%; } }
.hero-counter {
  color: white; font-variant-numeric: tabular-nums; font-size: 14px;
  display: flex; align-items: center; gap: 16px;
  background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
  padding: 10px 18px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.2);
}
.hero-counter .slash { opacity: 0.6; }
.hero-counter button { color: white; opacity: 0.8; }
.hero-counter button:hover { opacity: 1; }

.scroll-hint {
  position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.7); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  pointer-events: none;
}
.scroll-hint .line { width: 1px; height: 32px; background: rgba(255,255,255,0.5); position: relative; overflow: hidden; }
.scroll-hint .line::after {
  content: ""; position: absolute; top: -16px; left: 0; right: 0; height: 16px;
  background: white; animation: scrollDown 2s ease-in-out infinite;
}
@keyframes scrollDown { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(32px); } }

/* Placeholder dog photo */
.dog-photo {
  width: 100%; aspect-ratio: 3/4; border-radius: var(--radius);
  background: var(--cream-2); position: relative; overflow: hidden;
}
.dog-photo.square { aspect-ratio: 1/1; }
.dog-photo.wide { aspect-ratio: 4/3; }
.dog-photo.hero { aspect-ratio: auto; height: 100%; border-radius: 0; }

/* ===== MARQUEE ===== */
.marquee {
  background: var(--purple); color: white;
  padding: 12px 0; overflow: hidden;
  border-top: 1px solid rgba(255,255,255,0.08);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.marquee-track {
  display: flex; gap: 60px;
  animation: marquee 160s linear infinite;
  white-space: nowrap;
  width: max-content;
}
.marquee span {
  font-family: var(--font-serif); font-size: 20px; font-style: italic; font-weight: 400;
  display: inline-flex; align-items: center; gap: 60px;
}
.marquee span::after {
  content: "❋"; font-size: 11px; color: rgba(255,255,255,0.55);
  margin-left: 60px;
}
@keyframes marquee { to { transform: translateX(-50%); } }

/* ===== SECTION BASE ===== */
section { position: relative; }
.section { padding: 120px 0; }
.section-sm { padding: 80px 0; }
.section-header { text-align: center; margin-bottom: 64px; max-width: 720px; margin-left: auto; margin-right: auto; }
.section-header.left { text-align: left; margin-left: 0; }
.section-title {
  font-family: var(--font-serif); font-weight: 400;
  font-size: clamp(36px, 4.2vw, 58px);
  line-height: 1.05; letter-spacing: -0.02em;
  margin: 16px 0 20px;
  color: var(--ink);
}
.section-title em { font-style: italic; color: var(--blue); }
.section-lead { font-size: 19px; color: var(--ink-2); max-width: 56ch; margin: 0 auto; }

/* ===== ADOPTABLES GRID ===== */
.adoptables { background: var(--cream); }
.dogs-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
}
.dog-card {
  background: white; border-radius: var(--radius-lg); overflow: hidden;
  transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
  border: 1px solid rgba(22,32,43,0.04);
  position: relative;
  cursor: pointer;
}
.dog-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
.dog-card .photo-wrap { position: relative; padding: 14px; }
.dog-card .dog-photo { border-radius: 20px; aspect-ratio: 1/1; overflow: hidden; background: var(--cream-2); }
.dog-card .badge {
  position: absolute; top: 24px; left: 24px;
  background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
  padding: 6px 12px; border-radius: 999px;
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  font-weight: 600; color: var(--purple);
}
.dog-card .heart {
  position: absolute; top: 24px; right: 24px;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.9); backdrop-filter: blur(8px);
  display: grid; place-items: center;
  transition: all 0.2s;
}
.dog-card .heart:hover { background: white; transform: scale(1.1); }
.dog-card .heart svg { width: 16px; height: 16px; stroke: var(--purple); fill: none; stroke-width: 2; }
.dog-card .heart.active svg { fill: var(--purple); }
.dog-card .info { padding: 6px 22px 22px; }
.dog-card .name {
  font-family: var(--font-serif); font-size: 26px; font-weight: 500; letter-spacing: -0.01em;
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  margin-bottom: 6px;
}
.dog-card .age { font-family: var(--font-sans); font-size: 13px; color: var(--ink-3); font-weight: 500; }
.dog-card .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.dog-card .tag {
  font-size: 11px; padding: 4px 10px; border-radius: 999px;
  background: var(--blue-50); color: var(--blue-700); font-weight: 500;
  letter-spacing: 0.02em;
}
.dog-card .cta-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line);
  font-size: 13px; color: var(--ink-3);
}
.dog-card .arrow {
  width: 30px; height: 30px; border-radius: 50%; background: var(--ink);
  display: grid; place-items: center; transition: all 0.3s var(--ease);
}
.dog-card:hover .arrow { background: var(--blue); transform: rotate(-45deg); }
.dog-card .arrow svg { width: 13px; height: 13px; stroke: white; fill: none; stroke-width: 2; }

.dog-card.see-more {
  background: var(--blue); color: white;
  display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 40px; min-height: 200px;
}
.dog-card.see-more:hover { background: var(--blue-700); }
.dog-card.see-more .see-more-num { font-family: var(--font-serif); font-size: 58px; font-weight: 400; line-height: 1; }
.dog-card.see-more .see-more-label { font-size: 14px; margin-top: 8px; opacity: 0.9; }
.dog-card.see-more .arrow-big {
  width: 48px; height: 48px; border-radius: 50%; background: white; color: var(--blue);
  display: grid; place-items: center; margin: 20px auto 0;
  transition: transform 0.3s var(--ease);
}
.dog-card.see-more:hover .arrow-big { transform: rotate(-45deg); }

/* Card style variants */
body[data-card-style="minimal"] .dog-card {
  background: transparent; border: none;
}
body[data-card-style="minimal"] .dog-card .photo-wrap { padding: 0; }
body[data-card-style="minimal"] .dog-card .dog-photo { border-radius: 14px; }
body[data-card-style="minimal"] .dog-card .info { padding: 16px 4px 4px; }
body[data-card-style="minimal"] .dog-card:hover { box-shadow: none; }
body[data-card-style="minimal"] .dog-card .cta-row { border-top: none; padding-top: 8px; }

body[data-card-style="polaroid"] .dog-card {
  background: white; padding: 16px 16px 24px; border-radius: 8px;
  box-shadow: var(--shadow);
  transform: rotate(var(--tilt, -1deg));
}
body[data-card-style="polaroid"] .dog-card:nth-child(3n+1) { --tilt: 1.2deg; }
body[data-card-style="polaroid"] .dog-card:nth-child(3n+2) { --tilt: -1.8deg; }
body[data-card-style="polaroid"] .dog-card:nth-child(3n) { --tilt: 0.8deg; }
body[data-card-style="polaroid"] .dog-card:hover { transform: rotate(0) translateY(-6px); }
body[data-card-style="polaroid"] .dog-card .photo-wrap { padding: 0; }
body[data-card-style="polaroid"] .dog-card .dog-photo { border-radius: 2px; }
body[data-card-style="polaroid"] .dog-card .info { padding: 14px 2px 0; text-align: center; }
body[data-card-style="polaroid"] .dog-card .name { justify-content: center; gap: 12px; }

// Reveal on scroll
const Reveal = ({ children, delay = 0, as: Tag = 'div', ...rest }) => {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setShown(true); obs.disconnect(); }
    }, { rootMargin: '-60px' });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return (
    <Tag ref={ref} className={`reveal ${shown ? 'in' : ''}`} style={{transitionDelay: `${delay}ms`}} {...rest}>
      {children}
    </Tag>
  );
};

const { useState: useS, useEffect: useEf } = React;

const TweaksPanel = ({ tweaks, setTweak, onClose }) => {
  const opts = {
    heroLayout: ["fullbleed", "split", "editorial"],
    cardStyle: ["editorial", "minimal", "polaroid"],
    motion: ["subtle", "moderate", "rich"],
  };
  const labels = { heroLayout: "Hero Layout", cardStyle: "Dog Card Style", motion: "Motion Intensity" };
  return (
    <div className="tweaks-panel open">
      <h4>Tweaks <button onClick={onClose}>×</button></h4>
      {Object.keys(opts).map(key => (
        <div className="tweak-row" key={key}>
          <label>{labels[key]}</label>
          <div className="tweak-segments">
            {opts[key].map(v => (
              <button key={v} className={tweaks[key] === v ? 'active' : ''} onClick={() => setTweak(key, v)}>{v}</button>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
};

const App = () => {
  const [tweaks, setTweaks] = useS(window.POMDR_TWEAKS);
  const [editMode, setEditMode] = useS(false);

  useEf(() => {
    document.body.dataset.cardStyle = tweaks.cardStyle;
    document.body.dataset.motion = tweaks.motion;
    document.body.dataset.heroLayout = tweaks.heroLayout;
  }, [tweaks]);

  useEf(() => {
    const handler = (e) => {
      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') setEditMode(true);
      if (e.data.type === '__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({type: '__edit_mode_available'}, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const setTweak = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    window.parent.postMessage({type: '__edit_mode_set_keys', edits: { [key]: val }}, '*');
  };

  return (
    <>
      <a href="#main" className="skip-link">Skip to main content</a>
      <window.Nav />
      <main id="main">
        <window.Hero />
        <window.Adoptables />
        <window.Mission />
        <window.Programs />
        <window.HelpingPaw />
        <window.Impact />
        <window.Videos />
        <window.Tails />
        <window.Events />
        <window.Newsletter />
      </main>
      <window.Footer />
      {editMode && <TweaksPanel tweaks={tweaks} setTweak={setTweak} onClose={() => setEditMode(false)} />}
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

<!-- Paw trail reveal. Plain JS, no library. Sizes the trail to the full page
     so the meander spans it, then reveals each paw as it enters the viewport. -->
<script>
(function () {
  var trail = document.querySelector('.paw-trail');
  if (!trail) return;
  function syncHeight() {
    var h = Math.max(
      document.documentElement.scrollHeight,
      document.body ? document.body.scrollHeight : 0
    );
    trail.style.height = h + 'px';
  }
  syncHeight();
  window.addEventListener('resize', syncHeight, { passive: true });
  // Re-sync after the React app and images settle so positions are accurate.
  window.addEventListener('load', function () {
    setTimeout(syncHeight, 200);
    setTimeout(syncHeight, 900);
  });
  var items = trail.querySelectorAll('.paw, .dog-cutout');
  if (!('IntersectionObserver' in window)) {
    Array.prototype.forEach.call(items, function (el) { el.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        e.target.classList.add('in');
        io.unobserve(e.target);
      }
    });
  }, { rootMargin: '0px 0px -8% 0px' });
  Array.prototype.forEach.call(items, function (el) { io.observe(el); });
})();
</script>
</body>
</html>
